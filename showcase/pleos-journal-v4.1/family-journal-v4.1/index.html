<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pleos Journal</title>
<style>
/* ===== design-v4 visual contract (copied unchanged from design-v4/index.html) ===== */

/* =====================================================================
   Pleos Journal · design v4 · visual contract
   Stage is authored at 1920 x 1080 CSS px and scaled to fit the viewport.
   (prototype query switches are not part of the app)
   ===================================================================== */
:root{
  /* evening canvas (app chrome) */
  --bg:#0E0F11; --s1:#17181B; --s2:#212327; --s3:#2E3136;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --t1:#F3EFE6; --t2:#B4AFA4; --t3:#7C786F;
  /* paper (the journal itself) */
  --paper:#F6F1E7; --paper2:#EAE3D4; --paper3:#DCD3C1;
  --ink:#1B1A17; --ink2:#5A544A; --ink3:#958D80;
  /* one signal colour: today, recording, favourite */
  --sig:#FF6A3D; --sig-soft:rgba(255,106,61,.16);
  --r-s:14px; --r-m:20px; --r-l:28px; --r-pill:999px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --sans:"Pretendard","Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:var(--sans);color:var(--t1);font-size:22px;line-height:1.4;-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;word-break:keep-all}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
img{display:block;width:100%;height:100%;object-fit:cover}
svg{display:block;flex:none}
.num{font-feature-settings:"tnum" 1,"lnum" 1;letter-spacing:-.04em}

#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;background:var(--bg);transform-origin:0 0;overflow:hidden}
.screen{position:absolute;inset:0;animation:enter .32s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- top bar (88) ---------- */
.bar{position:absolute;left:0;right:0;top:0;height:88px;display:flex;align-items:center;padding:0 56px;gap:20px}
.brand{font-size:27px;letter-spacing:-.02em;font-weight:700;margin-right:44px;white-space:nowrap}
.brand span{font-weight:300;color:var(--t2);margin-left:7px}
.tabs{display:flex;gap:4px}
.tab{height:64px;padding:0 24px;border-radius:var(--r-pill);font-size:24px;font-weight:500;color:var(--t3);display:flex;align-items:center;gap:10px;transition:color .2s,background .2s}
.tab small{font-size:17px;font-weight:600;color:var(--t3)}
.tab.on{color:var(--t1);background:var(--s2);font-weight:700}
.grow{flex:1}
.ib{width:64px;height:64px;border-radius:50%;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;color:var(--t1);transition:transform .15s var(--ease),background .2s}
.ib:active,.btn:active,.tile:active{transform:scale(.97)}
.btn{height:64px;padding:0 28px;border-radius:var(--r-pill);font-size:22px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:10px;white-space:nowrap;transition:transform .15s var(--ease),background .2s}
.btn.cream{background:var(--paper);color:var(--ink)}
.btn.ghost{background:var(--s1);border:1px solid var(--line);color:var(--t1);font-weight:600}
.btn.text{color:var(--t2);font-weight:600;padding:0 18px}
.btn.xl{height:80px;font-size:25px}
.bartitle{position:absolute;left:50%;top:0;height:88px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;font-size:23px;font-weight:600;white-space:nowrap}
.bartitle em{font-style:normal;color:var(--t3);font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;background:var(--sig);flex:none}

/* ---------- ALBUM ---------- */
.today{position:absolute;left:56px;top:112px;width:504px;height:936px;display:flex;flex-direction:column}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;color:var(--sig);letter-spacing:.02em}
.bigdate{display:flex;align-items:flex-end;gap:22px;margin-top:10px}
.bigdate b{font-size:196px;line-height:.8;font-weight:200;letter-spacing:-.06em;margin-left:-8px}
.bigdate div{padding-bottom:6px}
.bigdate strong{display:block;font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.bigdate span{display:block;font-size:24px;color:var(--t2)}
.stack{position:relative;flex:1;margin-top:20px}
.stack figure{position:absolute;width:372px;height:250px;border:8px solid var(--paper);border-radius:10px;overflow:hidden;box-shadow:0 24px 50px rgba(0,0,0,.55);background:var(--s2)}
.stack figure:nth-child(1){left:118px;top:36px;transform:rotate(6deg)}
.stack figure:nth-child(2){left:6px;top:150px;transform:rotate(-5deg)}
.stack figure:nth-child(3){left:84px;top:262px;transform:rotate(1.5deg)}
.todaymeta{margin:0 0 22px}
.todaymeta strong{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em}
.todaymeta span{display:block;font-size:20px;color:var(--t2);margin-top:2px}
.today .btn{width:100%}
.donebadge{display:inline-flex;align-items:center;gap:8px;color:var(--sig)}
.todaymeta strong.donebadge{display:flex}

.lib{position:absolute;left:616px;top:112px;right:56px;bottom:32px}
.libhead{height:72px;display:flex;align-items:center;gap:6px}
.libhead .yr{font-size:30px;font-weight:200;color:var(--t3);margin-right:18px}
.mo{height:56px;padding:0 16px;font-size:30px;font-weight:700;letter-spacing:-.03em;color:var(--t3);border-radius:var(--r-s);transition:color .2s}
.mo.on{color:var(--t1)}
.libhead .count{font-size:19px;color:var(--t3);margin-right:8px}
.libhead .btn{height:56px;font-size:20px;padding:0 22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:272px;gap:16px;margin-top:16px}
.cell{position:relative;border-radius:var(--r-m);overflow:hidden;background:var(--s2)}
.cell.feat{grid-column:span 2;grid-row:span 2;border-radius:var(--r-l)}
.tile{position:absolute;inset:0;display:block;text-align:left;transition:transform .2s var(--ease)}
.tile:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.20) 0,rgba(0,0,0,0) 26%,rgba(0,0,0,0) 40%,rgba(8,8,9,.62) 72%,rgba(8,8,9,.92) 100%)}
.tmeta{position:absolute;left:22px;right:22px;bottom:18px;z-index:1;display:flex;align-items:flex-end;gap:14px;color:#fff}
.tmeta b{font-size:64px;line-height:.86;font-weight:400;letter-spacing:-.05em}
.feat .tmeta b{font-weight:300}
.tmeta i{display:block;font-style:normal;font-size:17px;font-weight:600;opacity:.78;letter-spacing:.01em}
.tmeta strong{display:block;font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmeta .tx{min-width:0;flex:1;padding-bottom:1px}
.feat .tmeta{left:32px;right:32px;bottom:28px;gap:22px}
.feat .tmeta b{font-size:128px}
.feat .tmeta i{font-size:21px}
.feat .tmeta strong{font-size:40px;line-height:1.2}
.feat .tmeta p{font-size:21px;line-height:1.5;opacity:.82;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{position:absolute;left:18px;top:18px;z-index:1;display:flex;gap:8px}
.chip{height:36px;padding:0 13px;border-radius:var(--r-pill);background:rgba(14,15,17,.56);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-size:17px;font-weight:600;display:flex;align-items:center;gap:7px}
.chip.new{background:var(--sig);color:#1a0d07}
.fav{position:absolute;right:10px;top:10px;z-index:2;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;color:#fff}
.fav:before{content:"";position:absolute;inset:6px;border-radius:50%;background:rgba(14,15,17,.5)}
.fav svg{position:relative}
.cell.end{background:transparent;border:2px dashed var(--line2);display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:6px;padding:22px;color:var(--t2);text-align:left;width:100%}
.cell.end strong{font-size:24px;font-weight:700;color:var(--t1);letter-spacing:-.03em}
.cell.end span{font-size:18px;color:var(--t3)}
.fav svg{filter:drop-shadow(0 1px 6px rgba(0,0,0,.6));transition:transform .25s var(--ease)}
.fav.on svg{fill:var(--sig);stroke:var(--sig);transform:scale(1.08)}

/* ---------- PAPER PAGE (shared by compose canvas + journal reader) : 1808 x 952 ---------- */
.page{position:absolute;width:1808px;height:952px;background:var(--paper);color:var(--ink);border-radius:var(--r-l);padding:40px;display:flex;gap:48px;
  box-shadow:0 30px 80px rgba(0,0,0,.5);transform-origin:0 0}
.pphotos{width:1060px;flex:none;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:520px 36px 264px 36px;column-gap:16px;row-gap:0}
.pp{border-radius:var(--r-s);overflow:hidden;background:var(--paper2);position:relative}
.pp.hero{grid-column:span 2}
.pp.empty{border:2px dashed var(--paper3);background:transparent;display:grid;place-items:center;color:var(--ink3);font-size:22px}
.cap{font-size:18px;color:var(--ink2);display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden}
.cap.hero{grid-column:span 2}
.cap b{font-size:15px;font-weight:700;color:var(--ink3);letter-spacing:.06em}
.ptext{flex:1;min-width:0;display:flex;flex-direction:column}
.mast{display:flex;align-items:flex-end;gap:20px;padding-bottom:26px;border-bottom:1px solid var(--paper3)}
.mast b{font-size:136px;line-height:.78;font-weight:200;letter-spacing:-.06em;margin-left:-6px}
.mast strong{display:block;font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.mast span{display:block;font-size:21px;color:var(--ink2)}
.mast .cnt{margin-left:auto;flex:none;white-space:nowrap;font-size:19px;font-weight:600;color:var(--ink3);padding-bottom:4px}
.mast>div:not(.cnt){flex:none}
.ptitle{font-size:54px;line-height:1.22;font-weight:700;letter-spacing:-.04em;margin-top:32px}
.pstory{font-size:28px;line-height:1.78;color:#2f2c27;margin-top:24px;letter-spacing:-.01em}
.ph{color:var(--ink3);font-weight:500}
.soft{color:var(--ink3)}
.caret{display:inline-block;width:3px;height:1.05em;background:var(--sig);vertical-align:-.16em;margin-left:3px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.pvoice{margin-top:auto;background:var(--paper2);border-radius:var(--r-m);padding:22px 24px 22px}
.pvoice.empty{background:transparent;border:2px dashed var(--paper3);color:var(--ink3);font-size:21px;display:flex;align-items:center;gap:12px;height:96px}
.pvoice .lb{font-size:17px;font-weight:700;color:var(--ink2);letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.pvoice q{display:block;quotes:none;font-size:26px;line-height:1.5;font-weight:600;letter-spacing:-.02em;margin:8px 0 16px}
.player{display:flex;align-items:center;gap:18px}
.pbtn{width:64px;height:64px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;flex:none}
.wave{flex:1;height:48px;display:flex;align-items:center;gap:4px}
.wave i{flex:1;max-width:6px;border-radius:3px;background:var(--ink3);opacity:.55}
.wave i.on{background:var(--ink);opacity:1}
.ptime{font-size:20px;font-weight:600;color:var(--ink2)}
.wave.live i{background:var(--sig);opacity:1;animation:pulse 1.1s ease-in-out infinite;transform-origin:50% 50%}
@keyframes pulse{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}

/* ---------- COMPOSE ---------- */
.canvas{position:absolute;left:56px;top:112px;width:1248px;height:657px}
.canvas .page{transform:scale(.69027)}
.strip{position:absolute;left:56px;top:793px;width:1248px;height:255px}
.striphead{height:44px;display:flex;align-items:center;gap:12px;font-size:19px;font-weight:700;color:var(--t2)}
.striphead em{font-style:normal;font-weight:500;color:var(--t3)}
.srow{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:8px}
.sitem{height:132px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r-m);display:flex;align-items:center;gap:16px;padding:12px 18px 12px 12px;min-width:0}
.sitem .th{width:160px;height:106px;border-radius:12px;overflow:hidden;flex:none;position:relative}
.ord{position:absolute;left:8px;top:8px;min-width:30px;height:30px;padding:0 8px;border-radius:15px;background:var(--paper);color:var(--ink);font-size:16px;font-weight:800;display:grid;place-items:center}
.sitem .f{min-width:0;flex:1}
.sitem small{display:block;font-size:16px;font-weight:700;color:var(--t3);letter-spacing:.02em}
.sitem .v{font-size:21px;font-weight:600;line-height:1.35;margin-top:4px;padding-bottom:8px;border-bottom:1px solid var(--line2)}
.sitem.blank{border-style:dashed;justify-content:center;color:var(--t3);font-size:20px;background:transparent}

.dock{position:absolute;left:1328px;top:112px;width:536px;height:936px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r-l);padding:20px;display:flex;flex-direction:column}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mode{position:relative;height:124px;border-radius:24px;background:var(--s2);border:2px solid transparent;text-align:left;padding:14px 16px;display:flex;flex-direction:column;overflow:hidden;color:var(--t2);transition:border-color .2s,background .2s}
.mode strong{margin-top:auto;font-size:21px;font-weight:700;color:var(--t1);letter-spacing:-.02em;position:relative}
.mode span{font-size:17px;font-weight:600;position:relative}
.mode svg{position:relative}
.mode.on{border-color:var(--paper);background:var(--s3)}
.mode.done span{color:var(--sig)}
.mode .bgimg{position:absolute;inset:0;opacity:.5}
.mode .bgimg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,24,27,.2),rgba(23,24,27,.92))}
.panel{flex:1;min-height:0;padding:22px 6px 0;display:flex;flex-direction:column;animation:enter .28s var(--ease) both}
.panel h3{font-size:26px;font-weight:700;letter-spacing:-.03em;display:flex;align-items:center;gap:12px}
.panel h3 em{font-style:normal;font-size:16px;font-weight:600;color:var(--t3);border:1px solid var(--line2);border-radius:var(--r-pill);padding:3px 11px}
.panel .hint{font-size:19px;color:var(--t2);margin-top:4px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.pk{position:relative;height:158px;border-radius:18px;overflow:hidden;background:var(--s2)}
.pk.sel{outline:3px solid var(--paper);outline-offset:-3px}
.pk .ord{left:10px;top:10px;min-width:36px;height:36px;border-radius:18px;font-size:19px}
.pk .ring{position:absolute;left:10px;top:10px;width:36px;height:36px;border-radius:50%;border:2.5px solid #fff;background:rgba(0,0,0,.25)}
.pk.add{border:2px dashed var(--line2);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--t2);font-size:19px;font-weight:600}
.field{margin-top:18px}
.field small{display:block;font-size:16px;font-weight:700;color:var(--t3);letter-spacing:.02em}
.field .v{font-size:24px;font-weight:700;letter-spacing:-.02em;padding:6px 0 12px;border-bottom:1px solid var(--line2);min-height:52px}
.field .v.ph{color:var(--t3);font-weight:500}
.heard{flex:1;min-height:0;margin-top:16px;font-size:25px;line-height:1.62;letter-spacing:-.01em;overflow:hidden}
.heard .soft{color:var(--t3)}
.heard.q{font-weight:600;font-size:28px;line-height:1.5}
.rec{display:flex;align-items:center;gap:20px;padding:18px 0 4px}
.recbtn{width:104px;height:104px;border-radius:50%;background:var(--sig);color:#1a0d07;display:grid;place-items:center;flex:none;box-shadow:0 0 0 10px var(--sig-soft);transition:transform .15s var(--ease)}
.recbtn.idle{background:var(--paper);color:var(--ink);box-shadow:none}
.rec .side{flex:1;min-width:0}
.rec .wave{height:56px}
.rec .wave i{background:var(--t3)}
.rec .wave.live i{background:var(--sig)}
.rec .wave i.on{background:var(--t1)}
.rec .st{display:flex;justify-content:space-between;font-size:18px;font-weight:600;color:var(--t2);margin-top:6px}
.rec .st b{color:var(--sig);font-weight:700}
.sub{display:flex;gap:10px;margin-top:10px}
.sub .btn{height:56px;font-size:19px;padding:0 20px;flex:1}
.dockfoot{display:flex;gap:10px;padding-top:16px}
.dockfoot .btn.cream{flex:1;height:76px;font-size:24px}
.dockfoot .ib{width:76px;height:76px;background:var(--s2)}

/* ---------- JOURNAL ---------- */
.reader{position:absolute;left:56px;top:104px;width:1808px;height:952px}
.stepper{position:absolute;left:50%;top:0;height:88px;transform:translateX(-50%);display:flex;align-items:center;gap:8px}
.stepper .ib{width:56px;height:56px;background:transparent;border-color:transparent;color:var(--t2)}
.stepper .ib[disabled]{opacity:.25}
.stepper strong{font-size:24px;font-weight:700;letter-spacing:-.02em;padding:0 10px;white-space:nowrap}
.stepper span{font-size:19px;color:var(--t3);white-space:nowrap}
.ib.favon{color:var(--sig)}
.ib.favon svg{fill:var(--sig)}

/* ===== implementation additions: states the contract describes but does not draw ===== */
html,body{background:var(--bg);overscroll-behavior:none}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0;resize:none;user-select:text;-webkit-user-select:text;border-radius:0;min-width:0}
input::placeholder,textarea::placeholder{color:var(--t3);font-weight:500}
img{-webkit-user-drag:none}
::-webkit-scrollbar{display:none}
button{text-align:inherit}
.btn[disabled],.ib[disabled]{opacity:.32;pointer-events:none}
#screen{position:absolute;inset:0}
/* large display dates use proportional figures; timers and counts keep .num's tabular figures */
.bigdate b,.tmeta b,.mast b,.cday b{font-feature-settings:"pnum" 1,"lnum" 1}
.ripple{position:absolute;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;background:rgba(255,255,255,.2);box-shadow:0 0 0 1.5px rgba(255,255,255,.35);pointer-events:none;z-index:99;animation:rip .5s ease-out forwards}
@keyframes rip{from{transform:scale(.25);opacity:.9}to{transform:scale(1);opacity:0}}

/* album: scroll area, search, reset row, empty line */
.libscroll{position:absolute;left:0;right:0;top:72px;bottom:0;overflow-y:auto}
.lib.wide{left:56px}
.lib.wide .grid{grid-template-columns:repeat(4,1fr)}
.cell.end{cursor:pointer}
.searchrow{height:72px;display:flex;align-items:center;gap:12px}
.sfield{flex:1;height:64px;border-radius:var(--r-pill);background:var(--s1);border:1px solid var(--line2);display:flex;align-items:center;gap:14px;padding:0 26px;color:var(--t2)}
.sfield input{flex:1;height:100%;font-size:24px;font-weight:600;color:var(--t1)}
.sfield .count{font-size:19px;color:var(--t3);white-space:nowrap}
.resetrow{height:64px;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:18px;color:var(--t3)}
.resetrow button{height:64px;padding:0 10px;color:var(--t3);font-weight:600;text-decoration:underline;text-underline-offset:5px}
.emptyline{padding:150px 0;text-align:center;font-size:26px;font-weight:600;color:var(--t2);letter-spacing:-.02em}
.libtitle{font-size:30px;font-weight:700;letter-spacing:-.03em;padding:0 16px 0 0}
.stack figure:only-child{left:60px;top:110px;transform:rotate(-3deg)}

/* calendar */
.cal{position:absolute;left:56px;top:112px;width:1192px;bottom:32px}
.cal .libhead .mo{font-size:40px;padding:0 10px 0 0;color:var(--t1)}
.cal .libhead .ib{width:56px;height:56px}
.dow{display:grid;grid-template-columns:repeat(7,160px);gap:8px;height:32px;font-size:17px;font-weight:600;color:var(--t3);padding-left:14px;align-items:center}
.cgrid{display:grid;grid-template-columns:repeat(7,160px);grid-auto-rows:132px;gap:8px}
.cday{position:relative;border-radius:var(--r-s);overflow:hidden;background:var(--s1);color:var(--t3);display:block;transition:transform .15s var(--ease)}
.cday:active{transform:scale(.97)}
.cday b{position:absolute;left:14px;bottom:8px;z-index:1;font-size:40px;font-weight:300;line-height:1;letter-spacing:-.05em}
.cday.fut{background:transparent;border:1px solid var(--line)}
.cday.has{color:#fff}
.cday.has b{font-weight:400}
.cday.has:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1) 0,rgba(0,0,0,0) 35%,rgba(8,8,9,.8) 100%)}
.cday.is-today{box-shadow:0 0 0 2px var(--sig)}

  if(th&&lift<0&&draft&&draft.photos.length>1){lpXY=[ev.clientX,ev.clientY];var i=+th.dataset.i;lpTimer=setTimeout(function(){lift=i;suppressClick=true;blurAll();renderStrip();setTimeout(function(){suppressClick=false},700);},480);}},true);
['pointerup','pointercancel','pointerleave'].forEach(function(k){stage.addEventListener(k,function(){clearTimeout(lpTimer);},true);});
